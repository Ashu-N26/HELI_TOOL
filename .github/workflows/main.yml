name: Run HELI_TOOL Python Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # This adds a "Run" button so you can start it manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
- name: Checkout code
        uses: actions/checkout@v6  # Updated from @v4 to @v6

      - name: Set up Python
        uses: actions/setup-python@v6  # Updated from @v4 to @v6
        with:
          python-version: '3.10'
